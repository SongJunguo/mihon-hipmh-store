name: Silent publish Hipmh v1.6.4

on:
  push:
    branches: [main]
    paths:
      - 'PUBLISH_V164'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout store
        continue-on-error: true
        uses: actions/checkout@v7

      - name: Publish verified APK
        id: publish
        continue-on-error: true
        env:
          ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-4d90-81fd-a678-8bdf6574bf52/raw?se=2026-08-22T17%3A02%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=e17a954a-5009-5c5c-90e9-5c5f8949751b&skoid=b869bb08-96ac-4184-ab38-9c45e2890c4c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-22T00%3A51%3A48Z&ske=2026-08-23T00%3A51%3A48Z&sks=b&skv=2026-02-06&sig=a9Ujg5Mma%2BJ6ZomXSfXNgm2QNJLhTt2UowCw07Tkles%3D'
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/hipmh-v164.zip
          rm -rf /tmp/hipmh-v164
          mkdir -p /tmp/hipmh-v164
          unzip -q /tmp/hipmh-v164.zip -d /tmp/hipmh-v164
          APK="$(find /tmp/hipmh-v164 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test "$(stat -c%s "$APK")" = "45451"
          test "$(sha256sum "$APK" | awk '{print $1}')" = "3af0439ad0096b65fd372a63a78d49eca9e133b814b1072f00e84dff0d27dfb0"

          mkdir -p apk
          cp "$APK" apk/tachiyomi-zh.hipmhprivate-v1.6.4.apk
          rm -f apk/tachiyomi-zh.hipmhprivate-v1.6.3.apk

          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('index.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          ext = data['extensionList']['extensions'][0]
          ext['resources']['apkUrl'] = 'https://raw.githubusercontent.com/SongJunguo/mihon-hipmh-store/main/apk/tachiyomi-zh.hipmhprivate-v1.6.4.apk'
          ext['versionCode'] = 4
          ext['versionName'] = '1.6.4'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          rm -f PUBLISH_V164 .github/workflows/publish-v164.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'publish: Hipmh Private v1.6.4'
          git push

      - name: Publication summary
        if: always()
        run: |
          echo "publish=${{ steps.publish.outcome }}"
          exit 0
